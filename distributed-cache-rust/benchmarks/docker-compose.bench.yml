# Docker Compose для нагрузочного тестирования
# Запуск: docker compose -f benchmarks/docker-compose.bench.yml up -d
# Остановка: docker compose -f benchmarks/docker-compose.bench.yml down -v

services:
  cache-server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CACHE_BIND=0.0.0.0:8080
    healthcheck:
      test: ["CMD-SHELL", "printf '*1\\r\\n$4\\r\\nPING\\r\\n' | nc -w 2 127.0.0.1 8080 | grep -q '+PONG'"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
